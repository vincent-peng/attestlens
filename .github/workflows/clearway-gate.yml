name: Clearway Privacy Gate

on:
  pull_request:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  clearway:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # Advisory mode for the repository: SARIF visibility without blocking the PR.
      # Switch to blocking only after false positives are measured:
      #   node dist/cli/index.js audit . --format sarif --sarif-output clearway.sarif --fail-on-severity warning
      # With the current internal-validated pack, deterministic findings produce
      # deployDecision WARN; external/customer/legal validation can later support BLOCK.
      - name: Run Clearway advisory scan
        run: |
          node dist/cli/index.js audit . \
            --jurisdiction au-privacy-act \
            --opinion \
            --format sarif \
            --sarif-output clearway.sarif \
            --no-guardvibe \
            --no-mcp-scan \
            --no-fail

      - name: Remove intentional demo fixture from advisory SARIF
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const sarifPath = 'clearway.sarif';
          const sarif = JSON.parse(fs.readFileSync(sarifPath, 'utf8'));
          for (const run of sarif.runs ?? []) {
            run.results = (run.results ?? []).filter((result) => {
              return !(result.locations ?? []).some((location) => {
                const uri = location.physicalLocation?.artifactLocation?.uri ?? '';
                return uri.startsWith('demo/agent-pr-privacy-risk/fail/')
                  || uri.startsWith('demo/agent-pr-privacy-risk/pii-log-fail/');
              });
            });
          }
          fs.writeFileSync(sarifPath, `${JSON.stringify(sarif, null, 2)}\n`);
          NODE

      - name: Upload Clearway SARIF
        if: ${{ always() && hashFiles('clearway.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: clearway.sarif
          category: clearway-privacy

      # Product demo fixture: PII introduced by an agent reaches application
      # logs. Internal-validated packs produce deployDecision WARN by default,
      # and this demo policy treats WARN and above as CI-failing.
      - name: Verify PII logging gate fixture fails
        run: |
          set +e
          node dist/cli/index.js audit demo/agent-pr-privacy-risk/pii-log-fail \
            --jurisdiction au-privacy-act \
            --format sarif \
            --sarif-output clearway-demo-pii-log-fail.sarif \
            --no-guardvibe \
            --no-mcp-scan \
            --no-supply-chain \
            --no-behavioral \
            --fail-on-severity warning
          gate_status=$?
          set -e
          if [ "$gate_status" -ne 1 ]; then
            echo "Expected the failing fixture to exit 1 when WARN findings are configured to fail CI, but Clearway exited $gate_status."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const sarifPath = 'clearway-demo-pii-log-fail.sarif';
          if (!fs.existsSync(sarifPath)) {
            throw new Error('Expected clearway-demo-pii-log-fail.sarif to be written.');
          }
          const sarif = JSON.parse(fs.readFileSync(sarifPath, 'utf8'));
          const results = (sarif.runs ?? []).flatMap((run) => run.results ?? []);
          const expectedRuleId = 'AU.APP.11.1.personal-data-flows-into-application-logs';
          const result = results.find((entry) => entry.ruleId === expectedRuleId);
          if (!result) {
            throw new Error(`Expected SARIF to contain ${expectedRuleId}.`);
          }
          if (result.level !== 'warning') {
            throw new Error(`Expected PII logging fixture to emit warning-level SARIF, got ${result.level}.`);
          }
          NODE

      - name: Verify remediated PII logging fixture passes
        run: |
          node dist/cli/index.js audit demo/agent-pr-privacy-risk/pii-log-pass \
            --jurisdiction au-privacy-act \
            --format sarif \
            --sarif-output clearway-demo-pii-log-pass.sarif \
            --no-guardvibe \
            --no-mcp-scan \
            --no-supply-chain \
            --no-behavioral \
            --fail-on-severity warning
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const sarif = JSON.parse(fs.readFileSync('clearway-demo-pii-log-pass.sarif', 'utf8'));
          const results = (sarif.runs ?? []).flatMap((run) => run.results ?? []);
          if (results.length !== 0) {
            throw new Error(`Expected remediated fixture SARIF to have no results, found ${results.length}.`);
          }
          NODE

      # Optional local/demo blocking override. This does not change embedded
      # pack validation status; it only proves strict local policy can turn a
      # trusted internal-validated deterministic finding into BLOCK.
      - name: Verify internal-validation blocking override fixture fails
        run: |
          set +e
          node dist/cli/index.js audit demo/agent-pr-privacy-risk/fail \
            --jurisdiction au-privacy-act \
            --format sarif \
            --sarif-output clearway-demo-blocking-override.sarif \
            --no-guardvibe \
            --no-mcp-scan \
            --no-supply-chain \
            --no-behavioral \
            --allow-internal-validation-blocking \
            --fail-on-severity error
          gate_status=$?
          set -e
          if [ "$gate_status" -ne 1 ]; then
            echo "Expected the blocking override fixture to exit 1, but Clearway exited $gate_status."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const sarif = JSON.parse(fs.readFileSync('clearway-demo-blocking-override.sarif', 'utf8'));
          const results = (sarif.runs ?? []).flatMap((run) => run.results ?? []);
          const expectedRuleId = 'AU.APP.11.1.dockerfile-explicitly-runs-as-root';
          const result = results.find((entry) => entry.ruleId === expectedRuleId);
          if (!result) {
            throw new Error(`Expected SARIF to contain ${expectedRuleId}.`);
          }
          if (result.level !== 'error') {
            throw new Error(`Expected blocking override fixture to emit error-level SARIF, got ${result.level}.`);
          }
          NODE
